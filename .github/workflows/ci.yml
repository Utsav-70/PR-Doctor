name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy agent db github settings apps

  migrations:
    # Guards the one failure mode autogenerated migrations still have: models and
    # migrations drifting apart. Applies the chain to a real Postgres, then asserts
    # autogenerate finds nothing left to do.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prguard
          POSTGRES_PASSWORD: prguard
          POSTGRES_DB: prguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prguard"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://prguard:prguard@localhost:5432/prguard
      GITHUB_APP_ID: "1"
      GITHUB_WEBHOOK_SECRET: ci
      GITHUB_APP_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nci\n-----END PRIVATE KEY-----"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: upgrade head
        run: alembic upgrade head
      - name: downgrade / upgrade round-trip
        run: alembic downgrade base && alembic upgrade head
      - name: no model/migration drift
        run: |
          alembic revision --autogenerate -m drift-check
          if grep -qE "op\.(create|drop|alter|add)" db/migrations/versions/*drift-check*.py; then
            echo "::error::models and migrations have drifted — commit a real migration"
            cat db/migrations/versions/*drift-check*.py
            exit 1
          fi
          echo "no drift"

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: build ${{ matrix.target }} image
        run: docker build --target ${{ matrix.target }} -t prguard-${{ matrix.target }} .
