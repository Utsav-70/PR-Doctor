[alembic]
script_location = db/migrations
prepend_sys_path = .
# Migration filenames sort chronologically and read as a changelog.
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is intentionally absent — env.py reads DATABASE_URL from settings so
# there is exactly one source of truth for the connection string.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
