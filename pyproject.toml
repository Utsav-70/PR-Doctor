[project]
name = "prguard"
version = "0.1.0"
description = "GitHub PR review agent"
requires-python = ">=3.12"

# Dependencies are pinned in requirements.txt / requirements-dev.txt, which is what
# Docker and CI install. Kept out of here so there is one source of truth.

[tool.ruff]
line-length = 100
target-version = "py312"
# samples/repo is fixture code for the Phase 4 tools: it deliberately contains a
# syntax error (to exercise Tree-sitter's partial parse) and unidiomatic constructs.
# Linting it would fail CI on purpose-built inputs.
extend-exclude = ["db/migrations/versions", "samples"]  # autogenerated / fixtures

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear — mutable defaults, broad except
    "ASYNC",     # blocking calls inside async def
    "S",         # bandit — security
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",
]
ignore = [
    "S101",      # assert is fine
    "E501",      # line length is ruff-format's job
]

[tool.ruff.lint.per-file-ignores]
# Alembic's generated env.py runs at import time by design.
"db/migrations/env.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_reexport = true
show_error_codes = true
exclude = ["db/migrations/versions/", "samples/"]

# Strict where the logic lives. With no test suite, mypy is the main automated
# correctness signal, so these three packages get no slack.
[[tool.mypy.overrides]]
module = ["agent.*", "db.*", "github.*", "settings"]
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true
